spring.application.name=backend-api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/xettuyen2026?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

server.error.include-message=always

# JWT secret must be at least 32 characters for HS256.
app.jwt.secret=my-super-secret-key-my-super-secret-key-2026
app.jwt.expiration-ms=86400000

# Comma-separated front-end origins allowed by CORS.
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173